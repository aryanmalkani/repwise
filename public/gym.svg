<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="An empty gym at dusk: a squat rack with a loaded barbell, a dumbbell rack and a kettlebell, lit by a tall window">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1F25"/>
      <stop offset="1" stop-color="#262B33"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3A65A"/>
      <stop offset="0.55" stop-color="#E0685C"/>
      <stop offset="1" stop-color="#5B3F72"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6B36A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F6B36A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16191D"/>
      <stop offset="1" stop-color="#0E1013"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B4A30"/>
      <stop offset="1" stop-color="#4A3220"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B424C"/>
      <stop offset="0.45" stop-color="#5A636F"/>
      <stop offset="1" stop-color="#363C45"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E7EB"/>
      <stop offset="1" stop-color="#8E959F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F6B36A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F6B36A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="holes" width="22" height="20" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="10" r="2.6" fill="#1A1E23"/>
    </pattern>
  </defs>

  <!-- room -->
  <rect width="800" height="520" fill="url(#wall)"/>
  <rect x="0" y="392" width="800" height="12" fill="#2F353E"/>


  <!-- pendant lamps -->
  <g>
    <ellipse cx="80" cy="190" rx="120" ry="110" fill="url(#glow)" opacity="0.8"/>
    <line x1="80" y1="0" x2="80" y2="110" stroke="#0E1013" stroke-width="3"/>
    <path d="M58 132 L66 110 L94 110 L102 132 Z" fill="#11141A"/>
    <ellipse cx="80" cy="133" rx="22" ry="5" fill="#FFD9A0"/>
    <ellipse cx="745" cy="170" rx="100" ry="95" fill="url(#glow)" opacity="0.7"/>
    <line x1="745" y1="0" x2="745" y2="92" stroke="#0E1013" stroke-width="3"/>
    <path d="M725 112 L732 92 L758 92 L765 112 Z" fill="#11141A"/>
    <ellipse cx="745" cy="113" rx="20" ry="4.5" fill="#FFD9A0"/>
  </g>

  <!-- tall window with dusk light -->
  <g>
    <rect x="512" y="40" width="168" height="300" rx="6" fill="#11141A"/>
    <rect x="522" y="50" width="148" height="280" rx="3" fill="url(#sky)"/>
    <circle cx="612" cy="232" r="34" fill="#FFD9A0" opacity="0.9"/>
    <path d="M522 268 L560 248 L590 262 L628 236 L670 256 L670 330 L522 330 Z" fill="#3B2B4F" opacity="0.85"/>
    <path d="M522 292 L548 284 L575 296 L606 280 L640 292 L670 284 L670 330 L522 330 Z" fill="#2A1F3A"/>
    <rect x="593" y="50" width="6" height="280" fill="#11141A"/>
    <rect x="522" y="186" width="148" height="6" fill="#11141A"/>
    <rect x="504" y="338" width="184" height="10" rx="3" fill="#2F353E"/>
  </g>
  <polygon points="522,330 670,330 560,520 300,520" fill="url(#beam)"/>
  <ellipse cx="470" cy="470" rx="230" ry="40" fill="url(#glow)"/>

  <!-- floor -->
  <rect x="0" y="404" width="800" height="116" fill="url(#floor)"/>
  <g stroke="#1D2126" stroke-width="2">
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="0" y1="482" x2="800" y2="482"/>
    <line x1="120" y1="404" x2="60" y2="520"/>
    <line x1="680" y1="404" x2="740" y2="520"/>
  </g>

  <!-- lifting platform -->
  <polygon points="150,418 470,418 486,470 134,470" fill="url(#wood)"/>
  <polygon points="134,470 486,470 486,478 134,478" fill="#33231A"/>
  <g stroke="#3E2A1C" stroke-width="1.6" opacity="0.7">
    <line x1="146" y1="434" x2="474" y2="434"/>
    <line x1="141" y1="452" x2="480" y2="452"/>
  </g>

  <!-- squat rack -->
  <g>
    <rect x="168" y="96" width="24" height="330" fill="url(#steel)"/>
    <rect x="428" y="96" width="24" height="330" fill="url(#steel)"/>
    <rect x="168" y="96" width="24" height="300" fill="url(#holes)"/>
    <rect x="428" y="96" width="24" height="300" fill="url(#holes)"/>
    <rect x="160" y="84" width="300" height="20" rx="3" fill="#4A525D"/>
    <rect x="160" y="84" width="300" height="5" rx="2" fill="#69727E"/>
    <rect x="160" y="414" width="300" height="14" rx="3" fill="#2C3138"/>
    <!-- pull-up bar -->
    <rect x="150" y="70" width="320" height="7" rx="3.5" fill="url(#bar)"/>
    <!-- j-hooks -->
    <path d="M192 234 h14 v14 h-6 v-6 h-8 z" fill="#C8102E"/>
    <path d="M428 234 h-14 v14 h6 v-6 h8 z" fill="#C8102E"/>
    <!-- safety arms -->
    <rect x="186" y="330" width="40" height="8" rx="2" fill="#4A525D"/>
    <rect x="394" y="330" width="40" height="8" rx="2" fill="#4A525D"/>
  </g>

  <!-- loaded barbell on the hooks (plates in the app's colors) -->
  <g>
    <rect x="70" y="236" width="480" height="8" rx="4" fill="url(#bar)"/>
    <rect x="70" y="233" width="78" height="14" rx="4" fill="#BFC4CB"/>
    <rect x="472" y="233" width="78" height="14" rx="4" fill="#BFC4CB"/>
    <!-- left plates, inside to outside -->
    <rect x="128" y="174" width="18" height="132" rx="5" fill="#C8102E"/>
    <rect x="110" y="182" width="17" height="116" rx="5" fill="#1D5FC4"/>
    <rect x="94" y="194" width="15" height="92" rx="4" fill="#E2A400"/>
    <rect x="81" y="206" width="12" height="68" rx="4" fill="#1E8A4C"/>
    <rect x="73" y="228" width="7" height="24" rx="2" fill="#2C3138"/>
    <!-- right plates -->
    <rect x="474" y="174" width="18" height="132" rx="5" fill="#C8102E"/>
    <rect x="493" y="182" width="17" height="116" rx="5" fill="#1D5FC4"/>
    <rect x="511" y="194" width="15" height="92" rx="4" fill="#E2A400"/>
    <rect x="527" y="206" width="12" height="68" rx="4" fill="#1E8A4C"/>
    <rect x="540" y="228" width="7" height="24" rx="2" fill="#2C3138"/>
    <!-- plate highlights -->
    <g fill="#FFFFFF" opacity="0.14">
      <rect x="130" y="178" width="4" height="124" rx="2"/>
      <rect x="112" y="186" width="4" height="108" rx="2"/>
      <rect x="476" y="178" width="4" height="124" rx="2"/>
      <rect x="495" y="186" width="4" height="108" rx="2"/>
    </g>
  </g>

  <!-- dumbbell rack -->
  <g>
    <rect x="612" y="378" width="8" height="92" fill="#363C45"/>
    <rect x="762" y="378" width="8" height="92" fill="#363C45"/>
    <rect x="626" y="365.0" width="34" height="6" rx="2" fill="#AEB4BC"/>
    <rect x="626" y="358" width="11" height="20" rx="4" fill="#3A4049"/><rect x="628" y="360" width="3" height="16" rx="1.5" fill="#566070"/>
    <rect x="649" y="358" width="11" height="20" rx="4" fill="#3A4049"/><rect x="651" y="360" width="3" height="16" rx="1.5" fill="#566070"/>
    <rect x="666" y="363.5" width="36" height="6" rx="2" fill="#AEB4BC"/>
    <rect x="666" y="355" width="12" height="23" rx="4" fill="#3A4049"/><rect x="668" y="357" width="3" height="19" rx="1.5" fill="#566070"/>
    <rect x="690" y="355" width="12" height="23" rx="4" fill="#3A4049"/><rect x="692" y="357" width="3" height="19" rx="1.5" fill="#566070"/>
    <rect x="708" y="362.0" width="38" height="6" rx="2" fill="#AEB4BC"/>
    <rect x="708" y="352" width="13" height="26" rx="4" fill="#3A4049"/><rect x="710" y="354" width="3" height="22" rx="1.5" fill="#566070"/>
    <rect x="733" y="352" width="13" height="26" rx="4" fill="#3A4049"/><rect x="735" y="354" width="3" height="22" rx="1.5" fill="#566070"/>
    <rect x="624" y="412.0" width="42" height="6" rx="2" fill="#AEB4BC"/>
    <rect x="624" y="400" width="15" height="30" rx="4" fill="#3A4049"/><rect x="626" y="402" width="3" height="26" rx="1.5" fill="#566070"/>
    <rect x="651" y="400" width="15" height="30" rx="4" fill="#3A4049"/><rect x="653" y="402" width="3" height="26" rx="1.5" fill="#566070"/>
    <rect x="674" y="410.5" width="44" height="6" rx="2" fill="#AEB4BC"/>
    <rect x="674" y="397" width="16" height="33" rx="4" fill="#3A4049"/><rect x="676" y="399" width="3" height="29" rx="1.5" fill="#566070"/>
    <rect x="702" y="397" width="16" height="33" rx="4" fill="#3A4049"/><rect x="704" y="399" width="3" height="29" rx="1.5" fill="#566070"/>
    <rect x="726" y="409.0" width="46" height="6" rx="2" fill="#AEB4BC"/>
    <rect x="726" y="394" width="17" height="36" rx="4" fill="#3A4049"/><rect x="728" y="396" width="3" height="32" rx="1.5" fill="#566070"/>
    <rect x="755" y="394" width="17" height="36" rx="4" fill="#3A4049"/><rect x="757" y="396" width="3" height="32" rx="1.5" fill="#566070"/>
    <rect x="606" y="374" width="170" height="8" rx="3" fill="#4A525D"/>
    <rect x="606" y="426" width="170" height="8" rx="3" fill="#4A525D"/>
  </g>

  <!-- kettlebell -->
  <g>
        <path d="M548 446 q0 -26 18 -26 q18 0 18 26" fill="none" stroke="#2B3037" stroke-width="8" stroke-linecap="round"/>
    <circle cx="566" cy="466" r="26" fill="#2B3037"/>
    <rect x="550" y="486" width="32" height="6" rx="3" fill="#1D2126"/>
    <path d="M552 456 a18 18 0 0 1 10 -12" stroke="#4A525D" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- bench -->
  <g>
    <rect x="30" y="414" width="96" height="14" rx="5" fill="#C8102E"/>
    <rect x="30" y="414" width="96" height="4" rx="2" fill="#E2394E"/>
    <rect x="44" y="428" width="8" height="40" fill="#363C45"/>
    <rect x="104" y="428" width="8" height="40" fill="#363C45"/>
    <rect x="34" y="466" width="28" height="6" rx="3" fill="#2C3138"/>
    <rect x="94" y="466" width="28" height="6" rx="3" fill="#2C3138"/>
  </g>

  <!-- chalk dust in the light -->
  <g fill="#FFE2B8">
    <circle cx="420" cy="380" r="1.6" opacity="0.5"/>
    <circle cx="452" cy="352" r="1.2" opacity="0.4"/>
    <circle cx="486" cy="398" r="1.4" opacity="0.45"/>
    <circle cx="398" cy="420" r="1" opacity="0.35"/>
    <circle cx="520" cy="372" r="1.2" opacity="0.4"/>
    <circle cx="470" cy="430" r="1.6" opacity="0.3"/>
  </g>
</svg>
